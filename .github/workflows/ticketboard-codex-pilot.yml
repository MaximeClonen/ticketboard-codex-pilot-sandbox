name: Ticketboard manual Codex pilot

on:
  workflow_dispatch:
    inputs:
      agent_run_id:
        description: Approved Ticketboard agent-run UUID
        required: true
        type: string
      expected_base_sha:
        description: Exact approved lowercase 40-character base commit SHA
        required: true
        type: string

permissions: {}

concurrency:
  group: ticketboard-codex-pilot-sandbox
  cancel-in-progress: false

jobs:
  preflight:
    name: Credential-free immutable preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.bind.outputs.base_sha }}
      preflight_started_at_ms: ${{ steps.bind.outputs.preflight_started_at_ms }}
      dependency_artifact_name: ${{ steps.bind.outputs.dependency_artifact_name }}
      source_artifact_name: ${{ steps.bind.outputs.source_artifact_name }}
      source_run_attempt: ${{ steps.bind.outputs.source_run_attempt }}
      source_run_id: ${{ steps.bind.outputs.source_run_id }}
      trusted_artifact_name: ${{ steps.bind.outputs.trusted_artifact_name }}
    steps:
      - name: Bind immutable dispatch and producer coordinates
        id: bind
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_REPOSITORY: MaximeClonen/ticketboard-codex-pilot-sandbox
          EXPECTED_REPOSITORY_ID: "1312323027"
          EXPECTED_OWNER_ID: "111045231"
        run: |
          set -euo pipefail
          preflight_started_at_ms="$(date +%s%3N)"
          [[ "$preflight_started_at_ms" =~ ^[1-9][0-9]{12}$ ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$GITHUB_REPOSITORY_OWNER_ID" == "$EXPECTED_OWNER_ID" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$AGENT_RUN_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          trusted_name="ticketboard-codex-trusted-${AGENT_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source_name="ticketboard-codex-source-${AGENT_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dependency_name="ticketboard-codex-dependencies-${AGENT_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'base_sha=%s\n' "$EXPECTED_BASE_SHA"
            printf 'preflight_started_at_ms=%s\n' "$preflight_started_at_ms"
            printf 'dependency_artifact_name=%s\n' "$dependency_name"
            printf 'source_artifact_name=%s\n' "$source_name"
            printf 'source_run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'source_run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'trusted_artifact_name=%s\n' "$trusted_name"
          } >>"$GITHUB_OUTPUT"

      - name: Check out trusted tools from the protected workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ticketboard-trusted-source
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact base for inert packaging only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_base_sha }}
          path: ticketboard-pilot-source
          fetch-depth: 1
          persist-credentials: false

      - name: Install the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Verify bootstrap and create inert source snapshot
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ inputs.expected_base_sha }}
          SOURCE_ROOT: ${{ github.workspace }}/ticketboard-pilot-source
          TRUSTED_SOURCE: ${{ github.workspace }}/ticketboard-trusted-source
        run: |
          set -euo pipefail
          [[ "$(git -C "$TRUSTED_SOURCE" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -C "$TRUSTED_SOURCE" status --short)" ]]
          node "$TRUSTED_SOURCE/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_SOURCE" \
            "$TRUSTED_SOURCE/ticketboard-codex-pilot.bootstrap.json"
          snapshot_dir="$RUNNER_TEMP/ticketboard-source"
          install -d -m 700 "$snapshot_dir"
          node "$TRUSTED_SOURCE/.ticketboard/codex-pilot/source-snapshot.mjs" \
            create "$SOURCE_ROOT" "$BASE_SHA" "$AGENT_RUN_ID" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$TRUSTED_SOURCE/.ticketboard/codex-pilot/pilot-policy.json" \
            "$snapshot_dir/source.tar" "$snapshot_dir/manifest.json"

      - name: Preserve reviewed trusted tools including hidden paths
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bind.outputs.trusted_artifact_name }}
          path: |
            ticketboard-trusted-source/.github/workflows/ticketboard-codex-pilot.yml
            ticketboard-trusted-source/.ticketboard/codex-pilot
            ticketboard-trusted-source/ticketboard-codex-pilot.bootstrap.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          compression-level: 0

      - name: Preserve inert exact-base source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.bind.outputs.source_artifact_name }}
          path: |
            ${{ runner.temp }}/ticketboard-source/source.tar
            ${{ runner.temp }}/ticketboard-source/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  prepare_dependencies:
    name: Credentialless deterministic dependency preparation
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact_digest: ${{ steps.dependency_artifact.outputs.artifact-digest }}
    steps:
      - name: Refuse cross-attempt source reuse
        shell: bash
        env:
          SOURCE_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$SOURCE_ATTEMPT" ]]

      - name: Install the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve inert exact-base source snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.source_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-source

      - name: Prepare only immutable npm dependencies from the exact lockfile
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          SOURCE_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
          SOURCE_ROOT: ${{ runner.temp }}/ticketboard-source
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$SOURCE_ATTEMPT" ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/source-snapshot.mjs" \
            verify "$SOURCE_ROOT/source.tar" "$SOURCE_ROOT/manifest.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$AGENT_RUN_ID" "$BASE_SHA" "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT"
          repository="$RUNNER_TEMP/ticketboard-dependency-source/repository"
          dependency_home="$RUNNER_TEMP/ticketboard-dependency-home"
          npm_cache="$RUNNER_TEMP/ticketboard-npm-cache"
          dependency_output="$RUNNER_TEMP/ticketboard-dependencies"
          install -d -m 700 \
            "$repository" "$dependency_home" "$npm_cache" "$dependency_output"
          tar --extract --file "$SOURCE_ROOT/source.tar" --directory "$repository"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/dependency-snapshot.mjs" \
            validate-source "$repository"
          npm_version="$(
            env -i PATH="$PATH" HOME="$dependency_home" CI=true \
              npm_config_cache="$npm_cache" \
              npm_config_registry="https://registry.npmjs.org/" \
              npm_config_userconfig="/dev/null" \
              npm_config_globalconfig="/dev/null" \
              npm_config_ignore_scripts="true" \
              npm_config_audit="false" npm_config_fund="false" \
              npm_config_update_notifier="false" npm --version
          )"
          env -i PATH="$PATH" HOME="$dependency_home" CI=true \
            npm_config_cache="$npm_cache" \
            npm_config_registry="https://registry.npmjs.org/" \
            npm_config_userconfig="/dev/null" \
            npm_config_globalconfig="/dev/null" \
            npm_config_ignore_scripts="true" \
            npm_config_audit="false" npm_config_fund="false" \
            npm_config_update_notifier="false" npm_config_loglevel="error" \
            npm ci --ignore-scripts --no-audit --no-fund --prefix "$repository"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/dependency-snapshot.mjs" \
            create "$repository" "$AGENT_RUN_ID" "$BASE_SHA" \
            "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT" "$npm_version" \
            "$dependency_output/dependencies.bin" \
            "$dependency_output/manifest.json"
          chmod 600 \
            "$dependency_output/dependencies.bin" \
            "$dependency_output/manifest.json"
          rm -rf "$dependency_home" "$npm_cache" "$repository"

      - name: Preserve immutable dependency boundary only
        id: dependency_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.preflight.outputs.dependency_artifact_name }}
          path: |
            ${{ runner.temp }}/ticketboard-dependencies/dependencies.bin
            ${{ runner.temp }}/ticketboard-dependencies/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  baseline_source:
    name: Credentialless baseline verification
    needs: [preflight, prepare_dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {}
    steps:
      - name: Install the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve inert exact-base source snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.source_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-source

      - name: Retrieve immutable dependency boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.dependency_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-dependencies

      - name: Run exact clean-base verification without credentials
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          DEPENDENCY_ARTIFACT_DIGEST: ${{ needs.prepare_dependencies.outputs.artifact_digest }}
          DEPENDENCY_ROOT: ${{ runner.temp }}/ticketboard-dependencies
          SOURCE_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
          SOURCE_ROOT: ${{ runner.temp }}/ticketboard-source
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$SOURCE_ATTEMPT" ]]
          [[ "$DEPENDENCY_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/source-snapshot.mjs" \
            verify "$SOURCE_ROOT/source.tar" "$SOURCE_ROOT/manifest.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$AGENT_RUN_ID" "$BASE_SHA" "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT"
          repository="$RUNNER_TEMP/ticketboard-baseline/repository"
          private_home="$RUNNER_TEMP/ticketboard-baseline/home"
          install -d -m 700 "$repository" "$private_home"
          tar --extract --file "$SOURCE_ROOT/source.tar" --directory "$repository"
          npm_version="$(npm --version)"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/dependency-snapshot.mjs" \
            verify "$repository" "$AGENT_RUN_ID" "$BASE_SHA" \
            "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT" "$npm_version" \
            "$DEPENDENCY_ROOT/dependencies.bin" \
            "$DEPENDENCY_ROOT/manifest.json"
          if ! id -u ticketboard-verify >/dev/null 2>&1; then
            sudo useradd --no-create-home --shell /usr/sbin/nologin \
              ticketboard-verify
          fi
          chmod -R go-rwx "$TRUSTED_ROOT" "$SOURCE_ROOT" "$DEPENDENCY_ROOT"
          sudo chown -R ticketboard-verify:ticketboard-verify \
            "$repository" "$private_home"
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bash "$TRUSTED_ROOT/.ticketboard/codex-pilot/run-verify.sh" \
            baseline "$repository" "$private_home"

  setup_failure_report:
    name: Fresh OIDC-only setup failure report
    if: >-
      ${{
        always() &&
        (
          needs.preflight.result != 'success' ||
          needs.prepare_dependencies.result != 'success' ||
          needs.baseline_source.result != 'success'
        )
      }}
    needs: [preflight, prepare_dependencies, baseline_source]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted reporter from the protected workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ticketboard-setup-reporter
          fetch-depth: 1
          persist-credentials: false

      - name: Install the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Report a closed setup failure without source execution
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ github.workspace }}/ticketboard-setup-reporter
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -C "$TRUSTED_ROOT" status --short)" ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          private_dir="$RUNNER_TEMP/ticketboard-setup-failure-private"
          install -d -m 700 "$private_dir"
          reported="false"
          for report_attempt in 1 2 3; do
            set +e
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              request-oidc "$private_dir/oidc" ticketboard-agent-runner
            oidc_status="$?"
            if [[ "$oidc_status" -eq 0 ]]; then
              node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                report-failure "$private_dir/oidc" \
                "$TICKETBOARD_WORKSPACE_ID" "$AGENT_RUN_ID" \
                "GENERATE" "RUNNER_SETUP_FAILED"
              report_status="$?"
            else
              report_status="$oidc_status"
            fi
            set -e
            if [[ "$report_status" -eq 0 ]]; then
              reported="true"
              break
            fi
            sleep "$report_attempt"
          done
          rm -rf "$private_dir"
          [[ "$reported" == "true" ]]

  generate_patch:
    name: Credential-separated Codex patch generation
    needs: [preflight, prepare_dependencies, baseline_source]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_digest: ${{ steps.patch_artifact.outputs.artifact-digest }}
      patch_artifact_name: ${{ steps.patch_name.outputs.name }}
      patch_sha256: ${{ steps.patch_identity.outputs.patch_sha256 }}
      producer_attempt: ${{ steps.patch_name.outputs.producer_attempt }}
    steps:
      - name: Refuse cross-attempt artifact reuse
        shell: bash
        env:
          SOURCE_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$SOURCE_ATTEMPT" ]]

      - name: Bind generated artifact producer coordinates
        id: patch_name
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
        run: |
          set -euo pipefail
          name="ticketboard-codex-patch-${AGENT_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'name=%s\n' "$name" >>"$GITHUB_OUTPUT"
          printf 'producer_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"

      - name: Check out exact approved base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install reviewed Node runtime before credential exposure
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve immutable dependency boundary before credential exposure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.dependency_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-dependencies

      - name: Establish inert model workspace boundary
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          DEPENDENCY_ARTIFACT_DIGEST: ${{ needs.prepare_dependencies.outputs.artifact_digest }}
          DEPENDENCY_ROOT: ${{ runner.temp }}/ticketboard-dependencies
          SOURCE_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$SOURCE_ATTEMPT" ]]
          [[ "$DEPENDENCY_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ -z "$(git status --short)" ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          npm_version="$(npm --version)"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/dependency-snapshot.mjs" \
            verify "$GITHUB_WORKSPACE" "$AGENT_RUN_ID" "$BASE_SHA" \
            "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT" "$npm_version" \
            "$DEPENDENCY_ROOT/dependencies.bin" \
            "$DEPENDENCY_ROOT/manifest.json"
          if ! id -u codex-pilot >/dev/null 2>&1; then
            sudo useradd --create-home --shell /bin/bash codex-pilot
          fi
          sudo install -d -m 700 -o codex-pilot -g codex-pilot \
            /home/codex-pilot/pilot-input

      - name: Claim exact run and build bounded untrusted context
        id: claim
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PREFLIGHT_STARTED_AT_MS: ${{ needs.preflight.outputs.preflight_started_at_ms }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          umask 077
          private_dir="$RUNNER_TEMP/ticketboard-generate-private"
          install -d -m 700 "$private_dir"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          claim_started_at_ms="$(date +%s%3N)"
          [[ "$PREFLIGHT_STARTED_AT_MS" =~ ^[1-9][0-9]{12}$ ]]
          [[ "$claim_started_at_ms" =~ ^[1-9][0-9]{12}$ ]]
          setup_duration_ms=$((claim_started_at_ms - PREFLIGHT_STARTED_AT_MS))
          [[ "$setup_duration_ms" -ge 0 ]]
          [[ "$setup_duration_ms" -le 900000 ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            claim "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
            "$AGENT_RUN_ID" "$BASE_SHA" "$setup_duration_ms" \
            "$private_dir/claim" "$private_dir/context.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/prepare-context.mjs" \
            "$private_dir/context.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/prompt-template.md" \
            "$private_dir/prompt.md"
          sudo install -m 600 -o codex-pilot -g codex-pilot \
            "$private_dir/prompt.md" /home/codex-pilot/pilot-input/prompt.md
          sudo install -m 600 -o codex-pilot -g codex-pilot \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/codex-result.schema.json" \
            /home/codex-pilot/pilot-input/result.schema.json
          touch "$private_dir/alive"

      # Setup-only: the pinned official action installs CLI 0.145.0 and starts
      # its credential proxy. It receives no prompt or Codex home override.
      - name: Start official Codex credential proxy without model execution
        id: codex_proxy
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: "0.145.0"
          permission-profile: ":workspace"
          safety-strategy: unprivileged-user
          codex-user: codex-pilot

      - name: Supervise Codex and seal quarantine-safe candidate
        id: generate
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-generate-private"
          output_dir="$RUNNER_TEMP/ticketboard-generated"
          failure_code_file="$RUNNER_TEMP/ticketboard-generate-failure-code"
          sudo install -d -m 710 -o "$(id -u)" -g codex-pilot \
            "$output_dir"
          heartbeat_pid=""
          codex_pid=""
          cleanup_children() {
            rm -f "$private_dir/alive"
            for child in "$codex_pid" "$heartbeat_pid"; do
              if [[ -n "$child" ]] && kill -0 "$child" 2>/dev/null; then
                kill "$child" 2>/dev/null || true
              fi
            done
            for child in "$codex_pid" "$heartbeat_pid"; do
              if [[ -n "$child" ]]; then
                wait "$child" 2>/dev/null || true
              fi
            done
            sudo pkill -KILL -u codex-pilot 2>/dev/null || true
          }
          trap cleanup_children EXIT
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/git-boundary.mjs" \
            capture "$GITHUB_WORKSPACE" "$private_dir/git-boundary.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            heartbeat "$private_dir/oidc" "$private_dir/claim" \
            "$TICKETBOARD_WORKSPACE_ID" "$AGENT_RUN_ID" \
            "$private_dir/alive" 30 &
          heartbeat_pid="$!"
          bash "$TRUSTED_ROOT/.ticketboard/codex-pilot/run-codex.sh" \
            "$GITHUB_WORKSPACE" \
            /home/codex-pilot/pilot-input/prompt.md \
            /home/codex-pilot/pilot-input/result.schema.json \
            "$private_dir/codex-private.jsonl" \
            "$output_dir/structured-result.json" \
            /home/codex-pilot/.codex &
          codex_pid="$!"

          set +e
          wait -n -p finished_pid "$heartbeat_pid" "$codex_pid"
          first_status="$?"
          set -e
          if [[ "$finished_pid" == "$heartbeat_pid" ]]; then
            printf 'RUNNER_CONTEXT_STALE\n' >"$failure_code_file"
            kill "$codex_pid" 2>/dev/null || true
            wait "$codex_pid" 2>/dev/null || true
            codex_pid=""
            exit 1
          fi
          codex_pid=""
          for _ignored in 1 2; do
            sudo pkill -KILL -u codex-pilot 2>/dev/null || true
            sleep 0.1
          done
          if pgrep -u codex-pilot >/dev/null 2>&1; then
            printf 'CODEX_TIMEOUT\n' >"$failure_code_file"
            exit 1
          fi
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/git-boundary.mjs" \
            assert "$GITHUB_WORKSPACE" "$private_dir/git-boundary.json" || {
              printf 'RUNNER_CONTEXT_STALE\n' >"$failure_code_file"
              exit 1
            }
          rm -f "$private_dir/alive"
          set +e
          wait "$heartbeat_pid"
          heartbeat_status="$?"
          set -e
          heartbeat_pid=""
          if [[ "$first_status" -ne 0 || "$heartbeat_status" -ne 0 ]]; then
            if [[ "$first_status" -eq 124 || "$first_status" -eq 137 ]]; then
              printf 'CODEX_TIMEOUT\n' >"$failure_code_file"
            else
              printf 'CODEX_OUTPUT_INVALID\n' >"$failure_code_file"
            fi
            exit 1
          fi

          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/validate-result.mjs" \
            "$output_dir/structured-result.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" || {
              printf 'CODEX_OUTPUT_INVALID\n' >"$failure_code_file"
              exit 1
            }
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/redact-jsonl.mjs" \
            "$private_dir/codex-private.jsonl" \
            "$output_dir/safe-events.jsonl" \
            "$output_dir/runtime-usage.json" || {
              printf 'CODEX_OUTPUT_INVALID\n' >"$failure_code_file"
              exit 1
            }
          env -i \
            PATH="/usr/local/bin:/usr/bin:/bin" \
            HOME="$RUNNER_TEMP" LANG="C.UTF-8" \
            GIT_CONFIG_GLOBAL="/dev/null" GIT_CONFIG_NOSYSTEM="1" \
            GIT_CONFIG_SYSTEM="/dev/null" GIT_OPTIONAL_LOCKS="0" \
            GIT_TERMINAL_PROMPT="0" \
            git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c diff.external= diff --binary --no-ext-diff --no-textconv \
            "$BASE_SHA" -- >"$output_dir/quarantine-candidate.patch"
          if [[ ! -s "$output_dir/quarantine-candidate.patch" ]]; then
            printf 'PATCH_EMPTY\n' >"$failure_code_file"
            exit 1
          fi
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/patch-policy.mjs" \
            quarantine "$output_dir/quarantine-candidate.patch" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" || {
              printf 'PATCH_POLICY_DENIED\n' >"$failure_code_file"
              exit 1
            }
          rm -f "$output_dir/quarantine-candidate.patch"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/create-patch.mjs" \
            "$GITHUB_WORKSPACE" "$BASE_SHA" "$AGENT_RUN_ID" \
            "$output_dir/structured-result.json" \
            "$output_dir/runtime-usage.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$output_dir/change.patch" "$output_dir/manifest.json" || {
              printf 'CODEX_OUTPUT_INVALID\n' >"$failure_code_file"
              exit 1
            }
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            report-patch "$private_dir/oidc" "$private_dir/claim" \
            "$TICKETBOARD_WORKSPACE_ID" "$output_dir/manifest.json"

      - name: Report bounded generate-phase failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          CLAIM_OUTCOME: ${{ steps.claim.outcome }}
          CODEX_PROXY_OUTCOME: ${{ steps.codex_proxy.outcome }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-generate-private"
          failure_code_file="$RUNNER_TEMP/ticketboard-generate-failure-code"
          install -d -m 700 "$private_dir"
          if [[ "$CLAIM_OUTCOME" != "success" ]]; then
            failure_code="RUNNER_CLAIM_FAILED"
          elif [[ "$CODEX_PROXY_OUTCOME" != "success" ]]; then
            failure_code="CODEX_AUTH_FAILED"
          elif [[ -s "$failure_code_file" ]]; then
            failure_code="$(<"$failure_code_file")"
          else
            failure_code="CODEX_OUTPUT_INVALID"
          fi
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            report-failure "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
            "$AGENT_RUN_ID" "GENERATE" "$failure_code"

      - name: Remove credentials, prompt, raw JSONL, and rejected output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            "$RUNNER_TEMP/ticketboard-generate-private" \
            /home/codex-pilot/.codex \
            /home/codex-pilot/pilot-input
          rm -f "$RUNNER_TEMP/ticketboard-generate-failure-code"
          if [[ ! -s "$RUNNER_TEMP/ticketboard-generated/manifest.json" ]]; then
            rm -rf "$RUNNER_TEMP/ticketboard-generated"
          fi

      - name: Bind exact generated patch digest
        id: patch_identity
        shell: bash
        run: |
          set -euo pipefail
          patch_sha256="$(
            jq -er '.patchSha256 | select(test("^[0-9a-f]{64}$"))' \
              "$RUNNER_TEMP/ticketboard-generated/manifest.json"
          )"
          printf 'patch_sha256=%s\n' "$patch_sha256" >>"$GITHUB_OUTPUT"

      - name: Upload bounded candidate boundary
        id: patch_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.patch_name.outputs.name }}
          path: |
            ${{ runner.temp }}/ticketboard-generated/change.patch
            ${{ runner.temp }}/ticketboard-generated/manifest.json
            ${{ runner.temp }}/ticketboard-generated/safe-events.jsonl
            ${{ runner.temp }}/ticketboard-generated/structured-result.json
            ${{ runner.temp }}/ticketboard-generated/runtime-usage.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  validate_patch:
    name: Credentialless exact patch verification
    needs: [preflight, prepare_dependencies, generate_patch]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions: {}
    outputs:
      outcome: ${{ steps.validate.outputs.outcome }}
      reason_codes: ${{ steps.validate.outputs.reason_codes }}
    steps:
      - name: Install reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve immutable generated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.generate_patch.outputs.patch_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-generated

      - name: Retrieve immutable dependency boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.dependency_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-dependencies

      - name: Retrieve inert exact-base source snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.source_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-source

      # Final step by design. The trusted shell writes only a closed outcome
      # after the isolated repository process exits; no credential or artifact
      # action follows repository execution.
      - name: Classify candidate and run exact VERIFY in isolated namespace
        id: validate
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          DEPENDENCY_ARTIFACT_DIGEST: ${{ needs.prepare_dependencies.outputs.artifact_digest }}
          DEPENDENCY_ROOT: ${{ runner.temp }}/ticketboard-dependencies
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          PRODUCER_ATTEMPT: ${{ needs.generate_patch.outputs.producer_attempt }}
          SOURCE_ATTEMPT: ${{ needs.preflight.outputs.source_run_attempt }}
          SOURCE_ROOT: ${{ runner.temp }}/ticketboard-source
          SOURCE_RUN_ID: ${{ needs.preflight.outputs.source_run_id }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          write_outcome() {
            local outcome="$1"
            local reasons="$2"
            printf 'outcome=%s\n' "$outcome" >>"$GITHUB_OUTPUT"
            printf 'reason_codes=%s\n' "$reasons" >>"$GITHUB_OUTPUT"
          }
          [[ "$GITHUB_RUN_ATTEMPT" == "$SOURCE_ATTEMPT" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "$PRODUCER_ATTEMPT" ]]
          [[ "$DEPENDENCY_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/source-snapshot.mjs" \
            verify "$SOURCE_ROOT/source.tar" "$SOURCE_ROOT/manifest.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$AGENT_RUN_ID" "$BASE_SHA" "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/validate-result.mjs" \
            "$GENERATED_ROOT/structured-result.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json"
          classification="$RUNNER_TEMP/ticketboard-classification.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/patch-policy.mjs" \
            classify "$GENERATED_ROOT/change.patch" \
            "$GENERATED_ROOT/manifest.json" \
            "$GENERATED_ROOT/structured-result.json" \
            "$GENERATED_ROOT/runtime-usage.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$AGENT_RUN_ID" "$BASE_SHA" >"$classification"
          policy_outcome="$(jq -er '.outcome' "$classification")"
          policy_reasons="$(jq -cer '.reasonCodes' "$classification")"
          if [[ "$policy_outcome" == "DENIED" ]]; then
            write_outcome "DENIED" "$policy_reasons"
            exit 1
          fi
          if [[ "$policy_outcome" != "ALLOWED" ]]; then
            write_outcome "FAILED" '["ARTIFACT_INTEGRITY_FAILED"]'
            exit 1
          fi

          repository="$RUNNER_TEMP/ticketboard-validation/repository"
          private_home="$RUNNER_TEMP/ticketboard-validation/home"
          install -d -m 700 "$repository" "$private_home"
          export GIT_CONFIG_GLOBAL="/dev/null"
          export GIT_CONFIG_SYSTEM="/dev/null"
          export GIT_CONFIG_NOSYSTEM="1"
          export GIT_OPTIONAL_LOCKS="0"
          export GIT_TERMINAL_PROMPT="0"
          tar --extract --file "$SOURCE_ROOT/source.tar" --directory "$repository"
          git -C "$repository" init --quiet
          git -C "$repository" -c core.hooksPath=/dev/null add --all
          actual_tree="$(git -C "$repository" write-tree)"
          expected_tree="$(jq -er '.treeSha' "$SOURCE_ROOT/manifest.json")"
          [[ "$actual_tree" == "$expected_tree" ]]
          GIT_AUTHOR_DATE="2026-07-26T00:00:00Z" \
            GIT_COMMITTER_DATE="2026-07-26T00:00:00Z" \
            git -C "$repository" \
            -c user.name=ticketboard-baseline \
            -c user.email=ticketboard-baseline@invalid \
            -c core.hooksPath=/dev/null commit --quiet -m baseline
          if ! git -C "$repository" apply --check --whitespace=error-all \
            "$GENERATED_ROOT/change.patch"; then
            write_outcome "FAILED" '["PATCH_APPLY_FAILED"]'
            exit 1
          fi
          git -C "$repository" apply --whitespace=error-all \
            "$GENERATED_ROOT/change.patch"
          while IFS= read -r file; do
            git -C "$repository" add -N -- "$file"
          done < <(jq -er '.files[]' "$GENERATED_ROOT/manifest.json")
          git -C "$repository" diff --check
          reproduced="$RUNNER_TEMP/ticketboard-reproduced.patch"
          git -C "$repository" \
            -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c diff.external= diff --binary --no-ext-diff --no-textconv \
            HEAD -- >"$reproduced"
          [[ "$(sha256sum "$reproduced" | cut -d' ' -f1)" == \
            "$(jq -er '.patchSha256' "$GENERATED_ROOT/manifest.json")" ]]
          npm_version="$(npm --version)"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/dependency-snapshot.mjs" \
            verify "$repository" "$AGENT_RUN_ID" "$BASE_SHA" \
            "$SOURCE_RUN_ID" "$SOURCE_ATTEMPT" "$npm_version" \
            "$DEPENDENCY_ROOT/dependencies.bin" \
            "$DEPENDENCY_ROOT/manifest.json"

          if ! id -u ticketboard-verify >/dev/null 2>&1; then
            sudo useradd --no-create-home --shell /usr/sbin/nologin \
              ticketboard-verify
          fi
          chmod -R go-rwx \
            "$TRUSTED_ROOT" "$SOURCE_ROOT" "$DEPENDENCY_ROOT" "$GENERATED_ROOT"
          sudo chown -R ticketboard-verify:ticketboard-verify \
            "$repository" "$private_home"
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          set +e
          bash "$TRUSTED_ROOT/.ticketboard/codex-pilot/run-verify.sh" \
            validation "$repository" "$private_home"
          verify_status="$?"
          set -e
          sudo pkill -KILL -u ticketboard-verify 2>/dev/null || true
          if pgrep -u ticketboard-verify >/dev/null 2>&1; then
            write_outcome "FAILED" '["VERIFICATION_FAILED"]'
            exit 1
          fi
          if [[ "$verify_status" -ne 0 ]]; then
            write_outcome "FAILED" '["VERIFICATION_FAILED"]'
            exit 1
          fi
          write_outcome "ALLOWED" '[]'

  validation_report:
    name: Fresh OIDC-only validation report
    if: ${{ always() && needs.generate_patch.result == 'success' }}
    needs: [preflight, generate_patch, validate_patch]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment:
      name: ticketboard-agent-validate
    permissions:
      id-token: write
    outputs:
      outcome: ${{ steps.report.outputs.outcome }}
      reported: ${{ steps.report.outputs.reported }}
    steps:
      - name: Install reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools without checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve immutable generated boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.generate_patch.outputs.patch_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-generated

      - name: Rehash candidate and report trusted validator outcome
        id: report
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          PRODUCER_ATTEMPT: ${{ needs.generate_patch.outputs.producer_attempt }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
          VALIDATE_JOB_RESULT: ${{ needs.validate_patch.result }}
          VALIDATOR_OUTCOME: ${{ needs.validate_patch.outputs.outcome }}
          VALIDATOR_REASONS: ${{ needs.validate_patch.outputs.reason_codes }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$PRODUCER_ATTEMPT" ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/validate-result.mjs" \
            "$GENERATED_ROOT/structured-result.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json"
          classification="$RUNNER_TEMP/ticketboard-reporter-classification.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/patch-policy.mjs" \
            classify "$GENERATED_ROOT/change.patch" \
            "$GENERATED_ROOT/manifest.json" \
            "$GENERATED_ROOT/structured-result.json" \
            "$GENERATED_ROOT/runtime-usage.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$AGENT_RUN_ID" "$BASE_SHA" >"$classification"
          classified_outcome="$(jq -er '.outcome' "$classification")"
          classified_reasons="$(jq -cer '.reasonCodes' "$classification")"
          if [[ "$VALIDATE_JOB_RESULT" == "success" &&
                "$VALIDATOR_OUTCOME" == "ALLOWED" &&
                "$classified_outcome" == "ALLOWED" ]]; then
            outcome="ALLOWED"
            reasons='[]'
          elif [[ "$VALIDATE_JOB_RESULT" == "failure" &&
                  "$VALIDATOR_OUTCOME" == "DENIED" &&
                  "$classified_outcome" == "DENIED" &&
                  "$(jq -cS . <<<"$VALIDATOR_REASONS")" == \
                    "$(jq -cS . <<<"$classified_reasons")" ]]; then
            outcome="DENIED"
            reasons="$classified_reasons"
          elif [[ "$VALIDATE_JOB_RESULT" == "cancelled" ]]; then
            outcome="FAILED"
            reasons='["RUN_CANCELLED"]'
          elif [[ "$VALIDATE_JOB_RESULT" == "failure" &&
                  "$VALIDATOR_OUTCOME" == "FAILED" &&
                  "$classified_outcome" == "ALLOWED" &&
                  "$VALIDATOR_REASONS" =~ ^\[\"(PATCH_APPLY_FAILED|VERIFICATION_FAILED)\"\]$ ]]; then
            outcome="FAILED"
            reasons="$VALIDATOR_REASONS"
          else
            outcome="FAILED"
            reasons='["VALIDATION_ATTESTATION_INVALID"]'
          fi
          private_dir="$RUNNER_TEMP/ticketboard-validation-report"
          install -d -m 700 "$private_dir"
          trap 'rm -rf "$private_dir"' EXIT
          jq -n --arg outcome "$outcome" --argjson reasons "$reasons" \
            '{outcome: $outcome, reasonCodes: $reasons}' \
            >"$private_dir/validation-record.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            report-validation "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
            "$GENERATED_ROOT/manifest.json" \
            "$private_dir/validation-record.json"
          printf 'reported=true\n' >>"$GITHUB_OUTPUT"
          printf 'outcome=%s\n' "$outcome" >>"$GITHUB_OUTPUT"

  validation_report_failure:
    name: Fresh VALIDATE-only reporter recovery
    if: >-
      ${{
        always() &&
        needs.generate_patch.result == 'success' &&
        (
          needs.validation_report.result == 'failure' ||
          needs.validation_report.result == 'cancelled'
        )
      }}
    needs: [preflight, generate_patch, validation_report]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment:
      name: ticketboard-agent-validate
    permissions:
      id-token: write
    steps:
      - name: Install reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools without checkout
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve immutable generated boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.generate_patch.outputs.patch_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-generated

      - name: Report closed validation-reporter failure
        shell: bash
        env:
          PRODUCER_ATTEMPT: ${{ needs.generate_patch.outputs.producer_attempt }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$PRODUCER_ATTEMPT" ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          private_dir="$RUNNER_TEMP/ticketboard-validation-failure"
          install -d -m 700 "$private_dir"
          trap 'rm -rf "$private_dir"' EXIT
          printf '%s\n' \
            '{"outcome":"FAILED","reasonCodes":["VALIDATION_REPORT_FAILED"]}' \
            >"$private_dir/validation-record.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            report-validation "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
            "$GENERATED_ROOT/manifest.json" \
            "$private_dir/validation-record.json"

  publish_draft_pr:
    name: Protected draft pull-request publication
    if: >-
      ${{
        needs.validation_report.result == 'success' &&
        needs.validation_report.outputs.outcome == 'ALLOWED'
      }}
    needs: [preflight, generate_patch, validate_patch, validation_report]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: ticketboard-agent-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      capability_issued: ${{ steps.authorize.outputs.capability_issued }}
    steps:
      - name: Refuse cross-attempt artifact reuse
        shell: bash
        env:
          PRODUCER_ATTEMPT: ${{ needs.generate_patch.outputs.producer_attempt }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$PRODUCER_ATTEMPT" ]]

      - name: Install reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Retrieve reviewed trusted tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.preflight.outputs.trusted_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-trusted

      - name: Retrieve server-validated generated boundary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.generate_patch.outputs.patch_artifact_name }}
          path: ${{ runner.temp }}/ticketboard-generated

      - name: Revalidate artifact before checkout or write credentials
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/validate-result.mjs" \
            "$GENERATED_ROOT/structured-result.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/patch-policy.mjs" \
            assert "$GENERATED_ROOT/change.patch" \
            "$GENERATED_ROOT/manifest.json" \
            "$GENERATED_ROOT/structured-result.json" \
            "$GENERATED_ROOT/runtime-usage.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$AGENT_RUN_ID" "$BASE_SHA"

      - name: Fresh checkout of exact base with read-only ephemeral auth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply validated patch without executing repository code
        shell: bash
        env:
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="/dev/null"
          export GIT_CONFIG_SYSTEM="/dev/null"
          export GIT_CONFIG_NOSYSTEM="1"
          export GIT_OPTIONAL_LOCKS="0"
          export GIT_TERMINAL_PROMPT="0"
          [[ "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            rev-parse HEAD)" == "$BASE_SHA" ]]
          [[ -z "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            status --short)" ]]
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c diff.external= apply --check --whitespace=error-all \
            "$GENERATED_ROOT/change.patch"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c diff.external= apply --whitespace=error-all \
            "$GENERATED_ROOT/change.patch"
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            -c diff.external= diff --check --no-ext-diff --no-textconv

      - name: Obtain one-time server-bound publish capability
        id: authorize
        shell: bash
        env:
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          install -d -m 700 "$private_dir"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            authorize-publish "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
            "$GENERATED_ROOT/manifest.json" \
            "$private_dir/capability" "$private_dir/publication-envelope.json"
          printf 'capability_issued=true\n' >>"$GITHUB_OUTPUT"

      - name: Check publication lease before requesting GitHub token
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            publication-heartbeat "$private_dir/oidc" \
            "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" "$AGENT_RUN_ID"

      - name: Prepare exact deterministic commit without credentials
        shell: bash
        env:
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          TICKETBOARD_PUBLIC_URL: ${{ vars.TICKETBOARD_PUBLIC_URL }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/publish-draft-pr.mjs" \
            prepare "$GITHUB_WORKSPACE" \
            "$GENERATED_ROOT/change.patch" \
            "$GENERATED_ROOT/manifest.json" \
            "$GENERATED_ROOT/structured-result.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$private_dir/publication-envelope.json" \
            "$private_dir/publication-state.json"

      - name: Mint late one-repository GitHub App token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.TICKETBOARD_CODEX_APP_CLIENT_ID }}
          private-key: ${{ secrets.TICKETBOARD_CODEX_APP_PRIVATE_KEY }}
          owner: MaximeClonen
          repositories: ticketboard-codex-pilot-sandbox
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Check publication lease immediately before branch push
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            publication-heartbeat "$private_dir/oidc" \
            "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" "$AGENT_RUN_ID"

      - name: Push only server-bound non-default branch
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.app_token.outputs.token }}
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          TICKETBOARD_PUBLIC_URL: ${{ vars.TICKETBOARD_PUBLIC_URL }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/publish-draft-pr.mjs" \
            push "$GITHUB_WORKSPACE" \
            "$GENERATED_ROOT/manifest.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$private_dir/publication-envelope.json" \
            "$private_dir/publication-state.json"
          touch "$private_dir/branch-pushed"

      - name: Check publication lease immediately before draft PR creation
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            publication-heartbeat "$private_dir/oidc" \
            "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" "$AGENT_RUN_ID"

      - name: Create or recover exact draft pull request
        shell: bash
        env:
          GITHUB_APP_TOKEN: ${{ steps.app_token.outputs.token }}
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          TICKETBOARD_PUBLIC_URL: ${{ vars.TICKETBOARD_PUBLIC_URL }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/publish-draft-pr.mjs" \
            create-pr "$GENERATED_ROOT/manifest.json" \
            "$GENERATED_ROOT/structured-result.json" \
            "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
            "$private_dir/publication-envelope.json" \
            "$private_dir/publication-state.json" \
            "$private_dir/publication.json"

      - name: Check publication lease immediately before final report
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            publication-heartbeat "$private_dir/oidc" \
            "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" "$AGENT_RUN_ID"

      - name: Report draft PR and end in REVIEW_REQUIRED
        shell: bash
        env:
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            request-oidc "$private_dir/oidc" ticketboard-agent-runner
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
            report-publication "$private_dir/oidc" \
            "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" \
            "$private_dir/publication.json" \
            "$GENERATED_ROOT/structured-result.json" \
            "$GENERATED_ROOT/manifest.json"

      - name: Compensate exact orphan branch and report publication failure
        if: ${{ failure() || cancelled() }}
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          GENERATED_ROOT: ${{ runner.temp }}/ticketboard-generated
          GITHUB_APP_TOKEN: ${{ steps.app_token.outputs.token }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TICKETBOARD_PUBLIC_URL: ${{ vars.TICKETBOARD_PUBLIC_URL }}
          TRUSTED_ROOT: ${{ runner.temp }}/ticketboard-trusted
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/ticketboard-publish-private"
          if [[ -s "$private_dir/publication.json" ]]; then
            report_recovered="false"
            for report_attempt in 1 2 3; do
              set +e
              node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                request-oidc "$private_dir/oidc" ticketboard-agent-runner
              oidc_status="$?"
              if [[ "$oidc_status" -eq 0 ]]; then
                node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                  publication-heartbeat "$private_dir/oidc" \
                  "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" \
                  "$AGENT_RUN_ID"
                heartbeat_status="$?"
              else
                heartbeat_status="$oidc_status"
              fi
              if [[ "$heartbeat_status" -eq 0 ]]; then
                node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                  report-publication "$private_dir/oidc" \
                  "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" \
                  "$private_dir/publication.json" \
                  "$GENERATED_ROOT/structured-result.json" \
                  "$GENERATED_ROOT/manifest.json"
                report_status="$?"
              else
                report_status="$heartbeat_status"
              fi
              set -e
              if [[ "$report_status" -eq 0 ]]; then
                report_recovered="true"
                break
              fi
              sleep "$report_attempt"
            done
            if [[ "$report_recovered" == "true" ]]; then
              exit 0
            fi
            failure_code="TICKETBOARD_REPORT_FAILED"
          else
            failure_code="PULL_REQUEST_FAILED"
          fi
          if [[ ! -s "$private_dir/publication.json" &&
                -s "$private_dir/branch-pushed" ]]; then
            set +e
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/publish-draft-pr.mjs" \
              cleanup-orphan "$GENERATED_ROOT/manifest.json" \
              "$TRUSTED_ROOT/.ticketboard/codex-pilot/pilot-policy.json" \
              "$private_dir/publication-envelope.json" \
              "$private_dir/publication-state.json"
            cleanup_status="$?"
            set -e
            if [[ "$cleanup_status" -ne 0 ]]; then
              failure_code="ORPHAN_REF_CLEANUP_REQUIRED"
            fi
          elif [[ -s "$private_dir/publication.json" ]]; then
            :
          elif [[ -z "$GITHUB_APP_TOKEN" ]]; then
            failure_code="GITHUB_APP_AUTH_FAILED"
          else
            failure_code="BRANCH_PUSH_FAILED"
          fi
          if [[ ! -s "$private_dir/capability" ]]; then
            authorization_recovered="false"
            for authorize_attempt in 1 2 3; do
              set +e
              node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                request-oidc "$private_dir/oidc" ticketboard-agent-runner
              oidc_status="$?"
              if [[ "$oidc_status" -eq 0 ]]; then
                node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                  authorize-publish "$private_dir/oidc" \
                  "$TICKETBOARD_WORKSPACE_ID" \
                  "$GENERATED_ROOT/manifest.json" \
                  "$private_dir/capability" \
                  "$private_dir/publication-envelope.json"
                authorize_status="$?"
              else
                authorize_status="$oidc_status"
              fi
              set -e
              if [[ "$authorize_status" -eq 0 ]]; then
                authorization_recovered="true"
                break
              fi
              sleep "$authorize_attempt"
            done
          else
            authorization_recovered="true"
          fi
          if [[ "$authorization_recovered" == "true" ]]; then
            failure_reported="false"
            for failure_attempt in 1 2 3; do
              set +e
              node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                request-oidc "$private_dir/oidc" ticketboard-agent-runner
              oidc_status="$?"
              if [[ "$oidc_status" -eq 0 ]]; then
                node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                  report-publication-failure "$private_dir/oidc" \
                  "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" \
                  "$AGENT_RUN_ID" "$failure_code"
                failure_status="$?"
              else
                failure_status="$oidc_status"
              fi
              set -e
              if [[ "$failure_status" -eq 0 ]]; then
                failure_reported="true"
                break
              fi
              sleep "$failure_attempt"
            done
            [[ "$failure_reported" == "true" ]]
          else
            patch_sha256="$(jq -er '.patchSha256' "$GENERATED_ROOT/manifest.json")"
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              request-oidc "$private_dir/oidc" ticketboard-agent-runner
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              report-publication-pre-capability-failure \
              "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
              "$AGENT_RUN_ID" \
              "$(jq -er '.baseSha' "$GENERATED_ROOT/manifest.json")" \
              "$patch_sha256" "RUNNER_SETUP_FAILED"
          fi

      - name: Remove one-time capability and private publication files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ticketboard-publish-private"

  publish_pre_capability_failure_report:
    name: Protected pre-capability publication failure report
    if: >-
      ${{
        always() &&
        needs.validation_report.result == 'success' &&
        needs.validation_report.outputs.outcome == 'ALLOWED' &&
        needs.publish_draft_pr.result != 'success' &&
        needs.publish_draft_pr.outputs.capability_issued != 'true'
      }}
    needs: [preflight, generate_patch, validation_report, publish_draft_pr]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    environment:
      name: ticketboard-agent-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out trusted reporter from the protected workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: ticketboard-publication-failure-reporter
          fetch-depth: 1
          persist-credentials: false

      - name: Install the reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          cache: ""

      - name: Recover uncertain authorization or report exact pre-capability failure
        shell: bash
        env:
          AGENT_RUN_ID: ${{ inputs.agent_run_id }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PATCH_SHA256: ${{ needs.generate_patch.outputs.patch_sha256 }}
          PRODUCER_ATTEMPT: ${{ needs.generate_patch.outputs.producer_attempt }}
          TICKETBOARD_AGENT_URL: ${{ vars.TICKETBOARD_AGENT_URL }}
          TICKETBOARD_WORKSPACE_ID: ${{ vars.TICKETBOARD_WORKSPACE_ID }}
          TRUSTED_ROOT: ${{ github.workspace }}/ticketboard-publication-failure-reporter
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == "$PRODUCER_ATTEMPT" ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(git -C "$TRUSTED_ROOT" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git -C "$TRUSTED_ROOT" status --short)" ]]
          node "$TRUSTED_ROOT/.ticketboard/codex-pilot/verify-bootstrap.mjs" \
            "$TRUSTED_ROOT" \
            "$TRUSTED_ROOT/ticketboard-codex-pilot.bootstrap.json"
          private_dir="$RUNNER_TEMP/ticketboard-pre-capability-failure-private"
          install -d -m 700 "$private_dir"
          jq -n \
            --arg agentRunId "$AGENT_RUN_ID" \
            --arg baseSha "$BASE_SHA" \
            --arg patchSha256 "$PATCH_SHA256" \
            '{agentRunId:$agentRunId,baseSha:$baseSha,patchSha256:$patchSha256}' \
            >"$private_dir/manifest.json"
          authorization_recovered="false"
          for authorize_attempt in 1 2 3; do
            set +e
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              request-oidc "$private_dir/oidc" ticketboard-agent-runner
            oidc_status="$?"
            if [[ "$oidc_status" -eq 0 ]]; then
              node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
                authorize-publish "$private_dir/oidc" \
                "$TICKETBOARD_WORKSPACE_ID" "$private_dir/manifest.json" \
                "$private_dir/capability" \
                "$private_dir/publication-envelope.json"
              authorize_status="$?"
            else
              authorize_status="$oidc_status"
            fi
            set -e
            if [[ "$authorize_status" -eq 0 ]]; then
              authorization_recovered="true"
              break
            fi
            sleep "$authorize_attempt"
          done
          if [[ "$authorization_recovered" == "true" ]]; then
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              request-oidc "$private_dir/oidc" ticketboard-agent-runner
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              report-publication-failure "$private_dir/oidc" \
              "$private_dir/capability" "$TICKETBOARD_WORKSPACE_ID" \
              "$AGENT_RUN_ID" "RUNNER_SETUP_FAILED"
          else
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              request-oidc "$private_dir/oidc" ticketboard-agent-runner
            node "$TRUSTED_ROOT/.ticketboard/codex-pilot/ticketboard-client.mjs" \
              report-publication-pre-capability-failure \
              "$private_dir/oidc" "$TICKETBOARD_WORKSPACE_ID" \
              "$AGENT_RUN_ID" "$BASE_SHA" "$PATCH_SHA256" \
              "RUNNER_SETUP_FAILED"
          fi
          rm -rf "$private_dir"
